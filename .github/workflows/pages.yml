name: Build and deploy Szkola Trenerow to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare the complete app as a self-contained page
        run: |
          set -euo pipefail
          test -f Szkola-trenerow-pakiet.zip
          mkdir -p extracted _site
          unzip -q Szkola-trenerow-pakiet.zip -d extracted
          test -f extracted/szkola-trenerow/index.html
          cp -a extracted/szkola-trenerow/. _site/
          cp supabase-config.js _site/supabase-config.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("_site")
          html_path = root / "index.html"
          html = html_path.read_text(encoding="utf-8")
          css = (root / "styles.css").read_text(encoding="utf-8")
          app = (root / "app.js").read_text(encoding="utf-8")
          auth = (root / "auth.js").read_text(encoding="utf-8")
          config = (root / "supabase-config.js").read_text(encoding="utf-8")

          # Embed assets robustly, regardless of ./ prefixes or tag attributes.
          html, css_count = re.subn(
              r'<link\\b(?=[^>]*\\bhref=["\\'][^"\\']*styles\\.css(?:\\?[^"\\']*)?["\\'])[^>]*>',
              '<style>\\n' + css + '\\n</style>', html, count=1, flags=re.I
          )
          html, config_count = re.subn(
              r'<script\\b(?=[^>]*\\bsrc=["\\'](?:\\./)?supabase-config\\.js(?:\\?[^"\\']*)?["\\'])[^>]*>\\s*</script>',
              lambda m: '<script>\\n' + config + '\\n</script>', html, count=1, flags=re.I
          )
          html, app_count = re.subn(
              r'<script\\b(?=[^>]*\\bsrc=["\\'](?:\\./)?app\\.js(?:\\?[^"\\']*)?["\\'])[^>]*>\\s*</script>',
              lambda m: '<script>\\n' + app + '\\n</script>', html, count=1, flags=re.I
          )
          html, auth_count = re.subn(
              r'<script\\b(?=[^>]*\\bsrc=["\\'](?:\\./)?auth\\.js(?:\\?[^"\\']*)?["\\'])[^>]*>\\s*</script>',
              lambda m: '<script type="module">\\n' + auth + '\\n</script>', html, count=1, flags=re.I
          )
          if (css_count, config_count, app_count, auth_count) != (1, 1, 1, 1):
              raise SystemExit(f"Nie udało się osadzić zasobów: CSS={css_count}, config={config_count}, app={app_count}, auth={auth_count}")
          if '.app-shell' not in html or 'SZKOŁA TRENERÓW — offline-first educational prototype' not in html:
              raise SystemExit("Wynik nie zawiera stylów lub skryptu aplikacji")
          if re.search(r'<link\\b[^>]*href=["\\'][^"\\']*styles\\.css', html, flags=re.I):
              raise SystemExit("Pozostał zewnętrzny arkusz CSS")
          if re.search(r'<script\\b[^>]*src=["\\'](?:\\./)?(?:app|auth|supabase-config)\\.js', html, flags=re.I):
              raise SystemExit("Pozostał zewnętrzny skrypt aplikacji")
          html_path.write_text(html, encoding="utf-8")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
