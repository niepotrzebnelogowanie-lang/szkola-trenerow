name: Build and deploy Szkola Trenerow to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract the complete app
        run: |
          set -euo pipefail
          test -f Szkola-trenerow-pakiet.zip
          mkdir -p extracted _site
          unzip -q Szkola-trenerow-pakiet.zip -d extracted
          test -f extracted/szkola-trenerow/index.html
          test -f extracted/szkola-trenerow/styles.css
          test -f extracted/szkola-trenerow/app.js
          test -f extracted/szkola-trenerow/auth.js
          cp -a extracted/szkola-trenerow/. _site/
          cp supabase-config.js _site/supabase-config.js
          # Fail before deployment if the HTML points to missing local assets.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("_site")
          html = (root / "index.html").read_text(encoding="utf-8")
          for name in ("styles.css", "app.js", "auth.js", "supabase-config.js"):
              if not (root / name).is_file():
                  raise SystemExit(f"Missing deployed asset: {name}")
          if 'href="styles.css"' not in html or 'src="app.js"' not in html or 'src="auth.js"' not in html:
              raise SystemExit("The app HTML does not contain the expected asset references")
          print("Verified: index.html, styles.css, app.js, auth.js and Supabase config are together in _site.")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
