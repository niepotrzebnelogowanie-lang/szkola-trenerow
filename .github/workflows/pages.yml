name: Test and deploy Szkola Trenerow
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site from canonical root files
        run: |
          set -euo pipefail
          mkdir -p _site
          for file in index.html styles.css app.js auth.js supabase-config.js favicon.svg; do
            test -s "$file" || { echo "::error::Missing or empty required file: $file"; exit 1; }
            cp "$file" _site/
          done

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check _site/app.js
          node --check _site/auth.js

      - name: Check HTML references and app structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          root = Path("_site")
          html = (root / "index.html").read_text(encoding="utf-8")
          required = ['id="view-root"', 'id="modal-root"', 'id="toast-root"',
                      'src="supabase-config.js"', 'src="app.js"', 'src="auth.js"',
                      'href="styles.css"']
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Required app structure missing: " + ", ".join(missing))
          refs = re.findall(r'''(?:src|href)\s*=\s*["']([^"']+)["']''', html, re.I)
          for ref in refs:
              ref = ref.strip()
              if not ref or ref.startswith(("#", "//")) or re.match(r"^[a-z][a-z0-9+.-]*:", ref, re.I):
                  continue
              path = ref.split("?", 1)[0].split("#", 1)[0]
              if not path:
                  continue
              target = (root / path.lstrip("/")).resolve()
              if not target.is_file():
                  raise SystemExit(f"Local HTML asset not found: {ref}")
          print(f"PASS: required app structure and {len(refs)} local/external HTML references checked.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
